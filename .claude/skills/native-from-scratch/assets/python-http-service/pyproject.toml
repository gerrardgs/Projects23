[project]
name = "python-http-service"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "C90", "N", "S"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
python_version = "3.11"
