# Keeps the SHA-pinned actions and the template dependencies current.
# The 7-day cooldown lets a compromised release be detected before it is proposed here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /.agents/skills/native-from-scratch/assets/node-http-service
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directories:
      - /.agents/skills/native-from-scratch/assets/node-http-service
      - /.agents/skills/native-from-scratch/assets/python-http-service
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
