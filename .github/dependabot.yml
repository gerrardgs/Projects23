# Keeps the SHA-pinned actions and the template dependencies current.
# The 7-day cooldown lets a compromised release be detected before it is proposed here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /.agents/skills/native-from-scratch/assets/node-http-service
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directories:
      - /.agents/skills/native-from-scratch/assets/node-http-service
      - /.agents/skills/native-from-scratch/assets/python-http-service
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /.agents/skills/machine-learning/assets/baseline-classifier
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /.agents/skills/api-integration/assets/python-integration-kit
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /.agents/skills/chaos-engineering/assets/chaos-experiment-kit
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /tools/lint
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # typescript-eslint 8 declares the peer range typescript >=4.8.4 <6.1.0.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
  - package-ecosystem: pip
    directory: /tools/ci
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

