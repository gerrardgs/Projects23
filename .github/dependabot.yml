# Keeps the SHA-pinned actions, lockfiles, requirements and image digests current. Checked daily.
# The 7-day cooldown applies to version updates only: a compromised release has time to be detected
# before it is proposed here. Security updates (enable "Dependabot security updates" in the
# repository settings) are not subject to the cooldown. Pins Dependabot cannot read are checked
# daily by .github/workflows/freshness.yml (scripts/check-updates.mjs).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /.agents/skills/native-from-scratch/assets/node-http-service
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directories:
      - /.agents/skills/native-from-scratch/assets/node-http-service
      - /.agents/skills/native-from-scratch/assets/python-http-service
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /.agents/skills/machine-learning/assets/baseline-classifier
    schedule:
      interval: daily
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /.agents/skills/api-integration/assets/python-integration-kit
    schedule:
      interval: daily
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /.agents/skills/chaos-engineering/assets/chaos-experiment-kit
    schedule:
      interval: daily
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /.agents/skills/ai-agent-systems/assets/mcp-toolbox-sqlite
    schedule:
      interval: daily
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /tools/lint
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      # typescript-eslint 8 declares the peer range typescript >=4.8.4 <6.1.0.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /tools/ci
    schedule:
      interval: daily
    cooldown:
      default-days: 7

