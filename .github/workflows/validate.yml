name: Validate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily re-run, so newly published vulnerabilities in pinned dependencies are found
    # even when nothing in the repository changed.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: Spec, scripts and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Validator self-tests
        run: node --test "scripts/*.test.mjs"
      - name: Agent guardrail hook tests
        run: node --test ".agents/skills/security-hardening/assets/claude-code-guardrails/*.test.mjs"
      - name: Documentation checker tests
        run: node --test ".agents/skills/technical-documentation/assets/*.test.mjs"
      - name: Agent delivery, worktree, review, artifact audit and secret report helper tests
        run: node --test ".agents/skills/agent-delivery-loop/assets/*.test.mjs" ".agents/skills/git-worktrees/assets/*.test.mjs" ".agents/skills/coderabbit-review/assets/*.test.mjs" ".agents/skills/reverse-engineering/assets/*.test.mjs" ".agents/skills/secret-scanning/assets/*.test.mjs"
      - name: This repository's documentation set is complete
        run: node .agents/skills/technical-documentation/assets/check-docs.mjs docs
      - name: Validate rules, skills, mirror and links
        run: node scripts/agents-sync.mjs --check --all-markdown
      - name: Install lint tools
        run: python -m pip install -r tools/ci/requirements.txt
      - name: Cross-check frontmatter with a full YAML parser
        shell: python
        run: |
          import pathlib, re, sys, yaml
          files = sorted(pathlib.Path(".agents").rglob("*.md"))
          failures = 0
          for path in files:
              match = re.match(r"^---\n(.*?)\n---", path.read_text(encoding="utf-8"), re.S)
              if not match:
                  continue
              try:
                  yaml.safe_load(match.group(1))
              except yaml.YAMLError as error:
                  failures += 1
                  print(f"{path}: {error}")
          print(f"checked {len(files)} files, {failures} invalid")
          sys.exit(1 if failures else 0)
      - name: Lint shell scripts
        run: shellcheck --severity=style scripts/install.sh
      - name: Lint workflows
        run: actionlint
      - name: Audit workflows
        run: zizmor --offline .
      - name: Installer leaves an existing project's files alone
        run: |
          target="$RUNNER_TEMP/existing-project"
          mkdir -p "$target"
          printf '# Existing README\n' > "$target/README.md"
          printf 'existing agent rules\n' > "$target/AGENTS.md"
          bash scripts/install.sh --source . "$target"
          grep -qx '# Existing README' "$target/README.md"
          grep -qx 'existing agent rules' "$target/AGENTS.md"
          test ! -e "$target/LICENSE"
      - name: Installer produces a valid spec in a new project
        run: |
          target="$RUNNER_TEMP/new-project"
          mkdir -p "$target"
          bash scripts/install.sh --source . "$target"
          cd "$target" && node scripts/agents-sync.mjs --check

  node-template:
    name: Node.js template (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    defaults:
      run:
        working-directory: .agents/skills/native-from-scratch/assets/node-http-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high

  python-template:
    name: Python template (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: .agents/skills/native-from-scratch/assets/python-http-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip "setuptools>=83.0.0"
      - run: python -m pip install --group dev
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy app.py test_app.py
      - run: python -m unittest -v
      - run: pip-audit --strict

  ml-template:
    name: ML baseline template (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: .agents/skills/machine-learning/assets/baseline-classifier
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt -r ../../../../../tools/ci/requirements.txt
      - run: pip-audit -r requirements.txt --strict
      - run: ruff format --check .
      - run: ruff check .
      - run: python -m unittest -v
      - run: python baseline.py

  integration-kit:
    name: API integration kit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: .agents/skills/api-integration/assets/python-integration-kit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy webhooks.py http_client.py test_integration_kit.py
      - run: python -m unittest -v

  chaos-kit:
    name: Chaos experiment kit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: .agents/skills/chaos-engineering/assets/chaos-experiment-kit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy chaos.py fault_proxy.py example_experiment.py test_chaos_kit.py
      - run: python -m unittest -v
      - run: python example_experiment.py

  mcp-toolbox-example:
    name: MCP Toolbox example (real server over MCP stdio)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .agents/skills/ai-agent-systems/assets/mcp-toolbox-sqlite
    env:
      TOOLBOX_VERSION: "1.14.0"
      # SHA-256 of linux/amd64 v1.14.0 from https://github.com/googleapis/mcp-toolbox/releases/tag/v1.14.0
      TOOLBOX_SHA256: 8ff7c6034d792e2754999e101116ac63b8a9fb926dd2f736065d8e0ef85ead22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy test_toolbox_smoke.py
      - name: Download the pinned Toolbox binary and verify its checksum
        run: |
          curl -sSfL -o "$RUNNER_TEMP/toolbox" "https://storage.googleapis.com/mcp-toolbox-for-databases/v${TOOLBOX_VERSION}/linux/amd64/toolbox"
          echo "${TOOLBOX_SHA256}  $RUNNER_TEMP/toolbox" | sha256sum -c
          chmod +x "$RUNNER_TEMP/toolbox"
      - run: TOOLBOX_BIN="$RUNNER_TEMP/toolbox" python -m unittest -v

  clean-code:
    name: Clean-code lint (complexity <= 10, nesting <= 3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --prefix tools/lint
      - run: npm run --prefix tools/lint lint

  authorship:
    name: Authorship (only the human author, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: No commit credits an AI agent (rule 08 section 2)
        run: node scripts/check-authorship.mjs

  secret-scan:
    name: Secret scan of the full Git history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download gitleaks and verify its published checksum
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
      - name: Scan every commit on every branch
        run: ./gitleaks git --log-opts="--all" --redact --no-banner .
      - name: Scan the working tree
        run: ./gitleaks dir --redact --no-banner .

